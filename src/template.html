<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather app</title>
  </head>
  <body>
    <header>
      <form action="get">

        <div class="search-container">
          <input class="search-field"type="search" autofocus required placeholder="cityName..."/>
          <button class="search-btn" type="submit" >Search</button>
        </form>
      </div>
    </header>
 <main>
  <div class="weather-card">
    <div class="card-header">
      <h1 class="location">ResolvedAddress</h1>
      <p class="date-time">Mon, 04 Sep 2026 · 3:45 PM</p>
      <p class="feels-like">Feels like 32°</p>
    </div>

    <div class="card-main">
      <h2 class="temperature">28°C</h2>
      <p class="condition">Conditions</p>
      <p class="description">Description text goes here</p>
    </div>

    <div class="card-details">
      <div class="detail-item">
        <span class="detail-label">Humidity</span>
        <span class="detail-value">65%</span>
      </div>
      <div class="detail-item">
        <span class="detail-label">Precipitation</span>
        <span class="detail-value">10%</span>
      </div>
      <div class="detail-item">
        <span class="detail-label">Wind Speed</span>
        <span class="detail-value">12 km/h</span>
      </div>
    </div>
  </div>
</main>
  </body>
</html>
